workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - attra_ios
      vars:
        BUNDLE_ID: com.jpedrero.attra
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jpedrero.attra
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Decode Firebase iOS config
        script: |
          set -euo pipefail
          if [ -z "${IOS_FIREBASE_PLIST_B64:-}" ]; then
            echo "Missing IOS_FIREBASE_PLIST_B64 in Codemagic group attra_ios." >&2
            echo "Base64-encode ios/Runner/GoogleService-Info.plist and save it as a secure variable." >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          import pathlib

          output = pathlib.Path("ios/Runner/GoogleService-Info.plist")
          output.write_bytes(base64.b64decode(os.environ["IOS_FIREBASE_PLIST_B64"]))
          PY
          test -s ios/Runner/GoogleService-Info.plist
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print REVERSED_CLIENT_ID" ios/Runner/GoogleService-Info.plist)
          if [ -z "$REVERSED_CLIENT_ID" ]; then
            echo "GoogleService-Info.plist does not contain REVERSED_CLIENT_ID." >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" ios/Runner/Info.plist
          if [ -n "${IOS_ADMOB_APP_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $IOS_ADMOB_APP_ID" ios/Runner/Info.plist
          fi
      - name: Disable Flutter Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Dart format check
        script: dart format --set-exit-if-changed lib test
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter unit tests
        script: flutter test
      - name: App review demo preparation tests
        script: python3 -m unittest tool.test_seed_review_demo
      - name: Build Firebase Functions
        script: |
          cd functions
          npm ci
          npm run build
          node --test test/*.test.js
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Install iOS pods
        script: |
          set -euo pipefail

          # CocoaPods downloads binary pods with curl. Force HTTP/1.1 because
          # dl.google.com can terminate long HTTP/2 streams with error 92.
          export CURL_HOME="$CM_BUILD_DIR/.cocoapods-curl"
          mkdir -p "$CURL_HOME"
          cat > "$CURL_HOME/.curlrc" <<'CURLRC'
          http1.1
          retry-all-errors
          retry-connrefused
          retry-delay = 5
          connect-timeout = 30
          speed-limit = 1024
          speed-time = 60
          CURLRC

          cd ios
          max_attempts=4
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "CocoaPods install attempt $attempt of $max_attempts"
            if [ "$attempt" -eq 1 ]; then
              if pod install --repo-update; then
                break
              else
                install_status=$?
              fi
            else
              # The first attempt already refreshed the specs repository.
              if pod install; then
                break
              else
                install_status=$?
              fi
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "CocoaPods installation failed after $max_attempts attempts." >&2
              exit "$install_status"
            fi

            retry_delay=$((attempt * 15))
            echo "CocoaPods download failed; retrying in ${retry_delay}s..." >&2
            sleep "$retry_delay"
            attempt=$((attempt + 1))
          done
      - name: Build IPA
        script: |
          set -euo pipefail
          export CURL_HOME="$CM_BUILD_DIR/.cocoapods-curl"
          APP_VERSION_FULL="$(grep '^version:' pubspec.yaml | sed 's/version: //')"
          APP_VERSION="${APP_VERSION_FULL%%+*}"
          case "${PROJECT_BUILD_NUMBER:-}" in
            ''|*[!0-9]*)
              echo "PROJECT_BUILD_NUMBER must be a positive integer." >&2
              exit 1
              ;;
          esac
          if [ "$PROJECT_BUILD_NUMBER" -le 61 ]; then
            echo "PROJECT_BUILD_NUMBER must be greater than rejected build 61." >&2
            exit 1
          fi
          echo "Building iOS version $APP_VERSION ($PROJECT_BUILD_NUMBER)"
          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated." >&2
            exit 1
          fi
          IPA_CONTENTS="$(mktemp -d)"
          trap 'rm -rf "$IPA_CONTENTS"' EXIT
          unzip -q "$IPA_PATH" -d "$IPA_CONTENTS"
          APP_PLIST="$(find "$IPA_CONTENTS/Payload" -maxdepth 2 -name Info.plist -print -quit)"
          CF_BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          case "$CF_BUNDLE_VERSION" in
            ''|*[!0-9]*)
              echo "Generated IPA has an invalid CFBundleVersion: $CF_BUNDLE_VERSION" >&2
              exit 1
              ;;
          esac
          if [ "$CF_BUNDLE_VERSION" -le 61 ]; then
            echo "Generated IPA CFBundleVersion must be greater than rejected build 61; got $CF_BUNDLE_VERSION." >&2
            exit 1
          fi
          echo "Verified generated IPA CFBundleVersion: $CF_BUNDLE_VERSION"
    artifacts:
      - ios/Podfile.lock
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
